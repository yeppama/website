# Verifica automatica a ogni push e pull request: la stessa catena che CLAUDE.md
# impone prima di un commit (build + suite Node), più il controllo delle
# vulnerabilità note nelle dipendenze.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Storia completa: lo scan dei segreti legge anche i commit passati.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Invarianti di storeConfig
        run: npm run validate:config

      # Credenziali nei file tracciati. Non cerca stringhe ad alta entropia: il
      # token Storefront di Shopify e' pubblico per costruzione e sta nel codice.
      - name: Credenziali nel repository
        run: npm run scan:secrets -- --history

      - name: Build di produzione
        run: npm run build

      - name: Logica di navigazione
        run: npm run test:nav

      - name: Vai a, una sola voce "sei qui" (negozio e cantiere)
        run: npm run test:quicktravel

      - name: Scelta del tier per dispositivo
        run: npm run test:device

      - name: Contratto del commercio (senza rete)
        run: npm run test:commerce

      - name: Controllo degli scope sul token della build (senza rete)
        run: npm run test:scopes

      # Il filtro HTML delle pagine legali gira anche sui push di soli documenti:
      # l'e2e che lo copriva prima li salta (audit 2026-11-02, §4-bis punto 1).
      - name: Filtro HTML delle pagine legali
        run: npm run test:sanitize

      - name: Import del catalogo
        run: npm run test:catalog

      - name: Inquadrature del Focus
        run: npm run test:framing

      # Gira le invarianti su entrambi i contenuti (`into` e `demo`) e su
      # entrambi gli allestimenti (negozio e cantiere): la build ne verifica
      # uno solo, quello del branch.
      - name: Contenuti e allestimenti
        run: npm run test:content

  # Le suite col browser stanno in `.github/workflows/e2e.yml`, non qui: girano
  # in parallelo a questo workflow, ma con un filtro sui percorsi che questo
  # non deve avere, e GitHub filtra i percorsi per workflow e non per job.

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Fallisce solo su vulnerabilità alte o critiche: le minori non devono
      # bloccare una pipeline che gira a ogni push.
      - name: Vulnerabilità note nelle dipendenze
        run: npm audit --audit-level=high --package-lock-only
